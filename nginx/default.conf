server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        application/font-sfnt;

    # Endpoint de healthcheck (usado pelo HEALTHCHECK do Docker)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # CSS/JS: sempre revalidar (evita cache travado durante atualizações)
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Imagens/fontes: cache moderado (1 dia), sem immutable
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML nunca em cache (sempre pega a versão nova ao recarregar)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
