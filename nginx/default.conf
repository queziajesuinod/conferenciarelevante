# Pré-render (scripts/prerender.mjs, gerado no build do Docker):
# /ministracao?v=<id> e /evento?id=<id> recebem a cópia com título/imagem
# já preenchidos, para as prévias do WhatsApp/Google. IDs fora do padrão
# (ou sem cópia gerada) caem na página normal.
map $arg_v $jr_ministracao {
    "~^(?<vid>[A-Za-z0-9_-]{1,64})$" /prerender/ministracao/$vid.html;
    default /ministracao.html;
}
map $arg_id $jr_evento {
    "~^(?<eid>[A-Za-z0-9-]{1,64})$" /prerender/evento/$eid.html;
    default /evento.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        application/font-sfnt;

    # Endpoint de healthcheck (usado pelo HEALTHCHECK do Docker)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Download do resumo em PDF — log dedicado para contabilizar downloads.
    # Cada download bem-sucedido gera UMA linha em /var/log/nginx/downloads.log
    # (ver scripts/contar-downloads.sh). Sem cache para não "perder" downloads.
    location = /assets/conferencia-relevante-2026-alegria.pdf {
        access_log /var/log/nginx/downloads.log combined;
        add_header Cache-Control "no-store";
        add_header Content-Disposition 'attachment; filename="Conferencia-Relevante-2026-Alegria.pdf"';
        try_files $uri =404;
    }

    location = /ministracao {
        add_header Cache-Control "no-cache";
        try_files $jr_ministracao /ministracao.html;
    }
    location = /evento {
        add_header Cache-Control "no-cache";
        try_files $jr_evento /evento.html;
    }
    # cópias pré-renderizadas só são servidas pelas rotas acima
    location ^~ /prerender/ {
        internal;
    }

    # CSS/JS: sempre revalidar (evita cache travado durante atualizações)
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Imagens/fontes: cache moderado (1 dia), sem immutable
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML nunca em cache (sempre pega a versão nova ao recarregar)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
