server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        application/font-sfnt;

    # Canonização: versões .html redirecionam para a URL limpa
    location = /index.html          { return 301 /; }
    location = /conferencia2026.html { return 301 /conferencia2026; }
    location = /ministracao.html    { return 301 /ministracao$is_args$args; }

    # Endpoint de healthcheck (usado pelo HEALTHCHECK do Docker)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache longo para estáticos (css, js, fontes, imagens)
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Página principal (URLs sem .html: /conferencia2026 → conferencia2026.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
